[install]
linker = "isolated"
minimumReleaseAge = 604800  # 7 days in seconds
minimumReleaseAgeExcludes = ["@pierre/diffs", "@pierre/highlights", "@pierre/theme", "@pierre/theming", "@pierre/trees", "@plannotator/atomic-editor", "@plannotator/markdown-editor", "@plannotator/sem-jiff", "@plannotator/web-highlighter", "@plannotator/webtui"]

[test]
preload = ["./tests/setup/gh-tripwire.ts", "./tests/setup/feedback-archive-off.ts", "./packages/ui/test-setup/happy-dom.ts"]
[loader]
".webp" = "file"
".png" = "file"
".webm" = "file"
".mp4" = "file"
".svg" = "file"
